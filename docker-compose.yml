services:
  teams_mcp:
    build: .
    container_name: teams_mcp
    restart: unless-stopped
    environment:
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-common}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET}
      BASE_URL: ${BASE_URL}
      PORT: ${PORT:-8001}
      TEAMS_MCP_DATA_DIR: /data
    volumes:
      # Persists the OAuth client registry. Without it, every restart invalidates the
      # clients' refresh tokens and forces all users to sign in again.
      - teams_mcp_data:/data
    networks:
      - default
      - n8n-docker_default

volumes:
  teams_mcp_data:

networks:
  n8n-docker_default:
    external: true