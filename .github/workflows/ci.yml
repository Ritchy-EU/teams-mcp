name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]

    env:
      AZURE_CLIENT_ID: "test-client-id"
      AZURE_TENANT_ID: "test-tenant-id"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run linting and formatting
        run: |
          npm run ci

      - name: Run type checking
        run: npm run compile

      - name: Run tests
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Test CLI functionality
        run: |
          node dist/index.js --help
          node dist/index.js check

      - name: Security audit
        # Fails on high/critical. Accepted moderates (2026-08): uuid via
        # @azure/msal-node v2 (msal never calls the vulnerable v3/v5/v6+buf
        # path; the real fix is the msal-node v5 major upgrade) and the
        # esbuild dev-server advisory (dev-only toolchain, never runs in CI).
        run: npm audit --audit-level high
